<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-label="Illustration of Orca with Port Authority: the sidebar shows a database icon before the billing-api worktree and a monitor icon before checkout-redesign; the status bar shows backend: billing-api and frontend: checkout-redesign.">
  <title>Port Authority in Orca (illustration)</title>
  <defs>
    <symbol id="layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/>
      <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/>
      <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>
    </symbol>
    <symbol id="branch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" x2="6" y1="3" y2="15"/>
      <circle cx="18" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/>
      <path d="M18 9a9 9 0 0 1-9 9"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8ab4ff"/>
    </marker>
    <clipPath id="frame"><rect width="800" height="330" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
    <rect width="800" height="330" fill="#141414"/>

    <!-- Sidebar -->
    <rect width="270" height="300" fill="#191919"/>
    <line x1="270" y1="0" x2="270" y2="300" stroke="#2a2a2a"/>
    <text x="18" y="30" fill="#7a7a7a" font-size="11" font-weight="600" letter-spacing="0.8">SHOP-APP</text>

    <g font-size="13.5">
      <use href="#branch" x="18" y="49" width="14" height="14" color="#6b6b6b"/>
      <text x="40" y="61" fill="#d4d4d4">main</text>

      <rect x="8" y="78" width="254" height="34" rx="6" fill="#262626"/>
      <use href="#branch" x="18" y="88" width="14" height="14" color="#8a8a8a"/>
      <text x="40" y="100" fill="#f2f2f2">🗄 billing-api</text>

      <use href="#branch" x="18" y="127" width="14" height="14" color="#6b6b6b"/>
      <text x="40" y="139" fill="#d4d4d4">🖥 checkout-redesign</text>

      <use href="#branch" x="18" y="166" width="14" height="14" color="#6b6b6b"/>
      <text x="40" y="178" fill="#d4d4d4">search-tuning</text>

      <use href="#branch" x="18" y="205" width="14" height="14" color="#6b6b6b"/>
      <text x="40" y="217" fill="#d4d4d4">docs-refresh</text>
    </g>

    <!-- Terminal in the selected worktree -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="296" y="34" fill="#7a7a7a">~/shop-app/billing-api</text>
      <text x="296" y="60" fill="#d4d4d4"><tspan fill="#7ee2a8">$</tspan> go run ./cmd/api</text>
      <text x="296" y="82" fill="#9a9a9a">listening on :8080</text>
    </g>

    <!-- Notes -->
    <g font-size="12.5" fill="#8ab4ff">
      <text x="430" y="150">The worktree that runs a service</text>
      <text x="430" y="167">gets its icon on the title.</text>
      <path d="M424 156 C 360 156, 330 140, 232 140" fill="none" stroke="#8ab4ff" stroke-width="1.5" marker-end="url(#arrow)"/>

      <text x="430" y="218">Press an item to open its worktree.</text>
      <path d="M560 226 C 560 250, 560 262, 560 284" fill="none" stroke="#8ab4ff" stroke-width="1.5" marker-end="url(#arrow)"/>
    </g>

    <!-- Status bar -->
    <rect x="0" y="300" width="800" height="30" fill="#1c1c1c"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#2a2a2a"/>
    <g font-size="12">
      <use href="#branch" x="14" y="308" width="13" height="13" color="#8a8a8a"/>
      <text x="33" y="319" fill="#a8a8a8">billing-api</text>
      <circle cx="122" cy="315" r="3.5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
      <text x="132" y="319" fill="#a8a8a8">2 agents</text>

      <use href="#layers" x="300" y="308" width="14" height="14" color="#6fcf97"/>
      <text x="319" y="319" fill="#d6d6d6">🗄️ backend: billing-api</text>

      <use href="#layers" x="506" y="308" width="14" height="14" color="#6fcf97"/>
      <text x="525" y="319" fill="#d6d6d6">🖥️ frontend: checkout-redesign</text>    </g>
  </g>
</svg>
